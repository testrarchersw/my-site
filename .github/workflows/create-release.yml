name: Conventional Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conventional-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The action needs the complete commit and tag history
          # to determine the next version.
          fetch-depth: 0

      - name: Determine version and create tag
        id: release
        uses: onesoft-sudo/conventional-release-action@v1.7.0
        with:
          changelog-file: CHANGELOG.md
          changelog-format: markdown

      - name: Create GitHub release
        if: steps.release.outputs.tag != ''
        uses: ncipollo/release-action@v2
        with:
          tag: ${{ steps.release.outputs.tag }}
          body: ${{ steps.release.outputs.release_notes }}
          generateReleaseNotes: false