name: Conventional Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # IMPORTANT:
          # conventional-release-action runs git pull --unshallow itself
          fetch-depth: 1

      - name: Determine version and create tag
        id: release
        uses: onesoft-sudo/conventional-release-action@v1.7.0
        with:
          git-push-branch: main
          changelog-file: CHANGELOG.md
          changelog-format: markdown
          add-release-notes: true

      - name: Show release outputs
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Version: $VERSION"
          echo "Tag: $TAG"

      - name: Create GitHub release
        if: steps.release.outputs.tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release.outputs.tag }}
          body: ${{ steps.release.outputs.release_notes }}